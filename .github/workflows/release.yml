name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag '$env:GITHUB_REF_NAME' is not vX.Y.Z; shipped clients parse releases/latest tags forever (ADR-0016)."
          }
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $pyprojectVersion = & uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to read the version from pyproject.toml (uv exited with code $LASTEXITCODE)."
          }
          $pyprojectVersion = $pyprojectVersion.Trim()
          if ($tagVersion -ne $pyprojectVersion) {
              throw "Tag v$tagVersion does not match pyproject version $pyprojectVersion"
          }
        shell: pwsh
      - id: build
        run: pwsh packaging/build.ps1 -Installer
        shell: pwsh
      - run: pwsh packaging/smoke.ps1 -ExePath dist/StoneReader/StoneReader.exe
        shell: pwsh
      - run: |
          $version = '${{ steps.build.outputs.version }}'
          $generated = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$env:GITHUB_REF_NAME" --jq .body
          if ($LASTEXITCODE -ne 0) { throw "Generating release notes failed." }
          $header = Get-Content packaging/release-notes-header.md -Raw
          Set-Content -LiteralPath notes.md -Value ($header + "`n" + $generated) -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" "dist/StoneReader-$version-Setup.exe" --title "StoneReader $version" --notes-file notes.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
